name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # the German Credit data are downloaded from UCI (and cached) so that
      # the data tests are not skipped
      MLAAS_DATA: ${{ github.workspace }}/.mlaas-data
      GLASSBOX_TEST_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache the UCI German Credit data
        uses: actions/cache@v4
        with:
          path: .mlaas-data
          key: uci-german-credit-v1
      - name: Install
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -v

  notebooks:
    runs-on: ubuntu-latest
    env:
      MLAAS_DATA: ${{ github.workspace }}/.mlaas-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache the UCI German Credit data
        uses: actions/cache@v4
        with:
          path: .mlaas-data
          key: uci-german-credit-v1
      - name: Install
        run: uv sync --locked --group notebooks
      - name: Run the notebooks
        run: |
          for notebook in notebooks/*.ipynb; do
            (cd "$(dirname "$notebook")" && uv run jupyter nbconvert --to notebook --execute --output /tmp/out.ipynb "$(basename "$notebook")")
          done
