# The Glass-Box application on a laptop using the Raspberry Pi hardware
# through its device server (the original set-up).
#   uv run glassbox -c config/laptop-with-device.toml serve

[app]
host = "0.0.0.0"             # reachable by the Pi (voice input, QR scanner)
port = 5000

[dialogue]
implementation = "fixed"

[nlu]
backend = "spacy"
thinking_delay = 2.0         # as the original: let the "thinking" LEDs be seen

[hardware.leds]
backend = "remote"
url = "http://raspberrypi.local:5001"

[hardware.speech]
backend = "remote"
url = "http://raspberrypi.local:5001"
