<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass-Box</title>
<style>
  :root {
    color-scheme: light;
    --page: #eef2f5;
    --sheet: #ffffff;
    --ink: #17324d;
    --muted: #5b6b7a;
    --rule: #d5dde4;
    --mine: #17324d;
    --mine-ink: #f3f6f8;
    --led: #e8a33d;
    --led-off: #c9d3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0f1a24;
      --sheet: #152330;
      --ink: #e4edf4;
      --muted: #9aabb9;
      --rule: #2a3c4d;
      --mine: #d9e4ee;
      --mine-ink: #10202e;
      --led: #f0b450;
      --led-off: #34495c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 46rem;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--sheet);
    border-left: 1px solid var(--rule);
    border-right: 1px solid var(--rule);
  }
  header {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 1.1rem 1.5rem;
    border-bottom: 1px solid var(--rule);
  }
  /* the LED ring of the device: lit while Glass-Box is answering */
  .ring {
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: conic-gradient(var(--led-off) 0 100%);
    -webkit-mask: radial-gradient(circle, transparent 52%, #000 54%);
    mask: radial-gradient(circle, transparent 52%, #000 54%);
    flex: none;
  }
  .ring.busy {
    background: conic-gradient(var(--led) 0 30%, var(--led-off) 30% 100%);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) {
    .ring.busy { animation: none; background: var(--led); }
  }
  h1 {
    margin: 0;
    font: 600 1.25rem/1.2 Charter, "Bitstream Charter", "Sitka Text",
      Cambria, Georgia, serif;
    letter-spacing: 0.01em;
  }
  header p { margin: 0; color: var(--muted); font-size: 0.875rem; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .hint { color: var(--muted); margin: auto 0; text-align: center; }
  .msg { max-width: 38rem; }
  .bot {
    font: 1.0625rem/1.65 Charter, "Bitstream Charter", "Sitka Text",
      Cambria, Georgia, serif;
    padding-left: 0.9rem;
    border-left: 3px solid var(--rule);
  }
  .me {
    align-self: flex-end;
    background: var(--mine);
    color: var(--mine-ink);
    padding: 0.5rem 0.85rem;
    border-radius: 1rem 1rem 0.25rem 1rem;
  }
  .source {
    display: block;
    font: 0.8125rem/1.4 system-ui, sans-serif;
    color: var(--muted);
    margin-bottom: 0.15rem;
  }
  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.5rem 1.25rem;
    border-top: 1px solid var(--rule);
  }
  input {
    flex: 1;
    font: inherit;
    color: var(--ink);
    background: var(--page);
    border: 1px solid var(--rule);
    border-radius: 0.5rem;
    padding: 0.6rem 0.8rem;
  }
  button {
    font: 600 1rem/1 system-ui, sans-serif;
    color: var(--mine-ink);
    background: var(--mine);
    border: 0;
    border-radius: 0.5rem;
    padding: 0 1.2rem;
    cursor: pointer;
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--led);
    outline-offset: 2px;
  }
  @media (max-width: 40rem) {
    main { border: 0; }
    header, #log, form { padding-left: 1rem; padding-right: 1rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="ring" id="ring" aria-hidden="true"></div>
    <div>
      <h1>Glass-Box</h1>
      <p>Ask why your loan application was accepted or declined.</p>
    </div>
  </header>
  <div id="log" role="log" aria-live="polite">
    <p class="hint" id="hint">Say “hello”, then give your application number
      (00 to 09) or your name.</p>
  </div>
  <form id="form">
    <label for="message" class="sr-only" hidden>Message</label>
    <input id="message" name="messageText" autocomplete="off"
           placeholder="Type a message" required>
    <button type="submit">Send</button>
  </form>
</main>
<script>
  const log = document.getElementById('log');
  const ring = document.getElementById('ring');
  const form = document.getElementById('form');
  const input = document.getElementById('message');
  const SOURCES = ['Voice: ', 'QR scanner: '];

  function add(text, mine) {
    const hint = document.getElementById('hint');
    if (hint) hint.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (mine ? 'me' : 'bot');
    for (const prefix of SOURCES) {
      if (text.startsWith(prefix)) {
        const label = document.createElement('span');
        label.className = 'source';
        label.textContent = prefix.slice(0, -2);
        div.appendChild(label);
        text = text.slice(prefix.length);
        if (prefix === 'QR scanner: ' || text === '') break;
      }
    }
    div.appendChild(document.createTextNode(text));
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    add(message, true);
    ring.classList.add('busy');
    try {
      const response = await fetch('/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message})
      });
      const data = await response.json();
      add(data.answer || 'No answer -- try rephrasing the question.');
    } catch (error) {
      add('Glass-Box is not reachable. Check that the server is running.');
    } finally {
      ring.classList.remove('busy');
      input.focus();
    }
  });

  // messages from the voice input and the QR scanner
  setInterval(async () => {
    try {
      const response = await fetch('/messages');
      const data = await response.json();
      for (const text of data.messages || []) add(text, false);
    } catch (error) { /* the server may be restarting */ }
  }, {{ poll_interval }});
</script>
</body>
</html>
